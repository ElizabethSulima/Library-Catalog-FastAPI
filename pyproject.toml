[tool.poetry]
package-mode = false
name = "library-catalog-api"
version = "1.0.0"

[tool.poetry.dependencies]
python = "^3.12"

# Web framework & Server
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.5"}

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.32"}
alembic = "^1.13.2"
psycopg = {extras = ["binary"], version = "^3.2.9"}

# Validation & Settings
pydantic = "^2.13.5"
pydantic-settings = "^2.10.1"

# HTTP Client
httpx = "^0.28.1"

# Observability & Logging
structlog = "^26.1.0"
asgi-correlation-id = "^5.0.1"

# Metrics & Error Tracking
sentry-sdk = "^2.71.0"

# Security & Auth
pyjwt = "^2.15.1"
argon2-cffi = "^25.1.0"

# Resilience
tenacity = "^9.1.4"
slowapi = "^0.1.10"
python-json-logger = "^4.2.0"
asyncpg = "^0.31.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
mypy = "^1.11.2"
ruff = "^0.16.9"
pre-commit = "^4.6.2"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"
respx = "^0.23.1"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/", ".venv/"]


[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: isort, B: flake8-bugbear, UP: pyupgrade
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade (автоматически заменяет устаревший синтаксис)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
# Игнорируем отсутствие docstring (аналог C0114, C0115, C0116 из pylint)
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "E501", "N818"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# mypy
[tool.mypy]
python_version = "3.12"
exclude = ["migrations/"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
enable_incomplete_feature = "NewGenericSyntax"

# Плагин для корректной работы с Pydantic
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "starlette.*",
    "pydantic_settings.*",
    "pytest.*",
    "httpx.*",
    "anyio.*",
    "pythonjsonlogger.*",
    "uvicorn.*",
    "slowapi.*",
    "respx.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.tests.*"
disallow_untyped_decorators = false
disable_error_code = ["no-untyped-def", "misc"]

[[tool.mypy.overrides]]
module = "app.api.v1.routers.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "app.main"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "app.core.middleware.*"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "app.core.settings"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
module = "app.core.exceptions"
disallow_untyped_decorators = false

# pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "-x --cov=app --cov-report=term-missing"
testpaths = ["app/tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]